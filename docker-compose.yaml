services:
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    env_file: 
      .env          # DB credentials stay on the server only
    ports: 
      - "8000:8000"
    volumes:
      - data:/app/backend/data
  client:
    build: { context: ., dockerfile: Dockerfile.client }
    environment:
      MEDIASSIST_API_URL: http://server:8000
    ports: 
      - "8501:8501"
    depends_on: 
      server:
        condition: service_started

volumes:
  data: